# Holder Supabase-prosjektet våkent: gratisprosjekter settes på pause etter en uke uten aktivitet.
# Kjører mandag og torsdag. Leser adressen og nøkkelen fra config.js, så ingen hemmeligheter trengs.
name: Hold databasen våken
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]+' config.js)
          if [[ "$URL" == *DITT-PROSJEKT* ]]; then echo "config.js er ikke fylt ut ennå"; exit 0; fi
          curl -sf -X POST "$URL/rest/v1/rpc/check_invite" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"c":"ping"}'
